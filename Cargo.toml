[package]
name    = "solana-mev-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mev-bot"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"

solana-client             = "1.18"
solana-sdk                = "1.18"
solana-program            = "1.18"

yellowstone-grpc-client = "13.2"
yellowstone-grpc-proto  = "12.5"
tonic = "0.14.6"

reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
bincode    = "1"
borsh      = "1"
anyhow    = "1"
thiserror = "1"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dashmap           = "5"
parking_lot       = "0.12"
crossbeam-channel = "0.5"
crossbeam-utils    = "0.8"

uint         = "0.9"
rust_decimal = { version = "1", features = ["maths"] }

dotenvy = "0.15"
clap    = { version = "4", features = ["derive", "env"] }

base64    = "0.22"
bs58      = "0.5"
futures   = "0.3"
once_cell = "1"
rand      = "0.8"
ahash     = "0.8"

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/solana-labs/curve25519-dalek", rev = "b500cdc2a920cd5bff9e2dd974d7b97349d61464" }


[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.release.build-override]
opt-level = 3

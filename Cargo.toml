[package]
name    = "solana-mev-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mev-bot"
path = "src/main.rs"

# ── async ──────────────────────────────────────────────────────────────────────
[dependencies]
tokio        = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"

# ── solana ─────────────────────────────────────────────────────────────────────
solana-client             = "1.18"
solana-sdk                = "1.18"
solana-transaction-status = "1.18"
solana-account-decoder    = "1.18"
solana-program            = "1.18"
spl-token                         = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account      = { version = "2.3", features = ["no-entrypoint"] }

# ── geyser grpc ────────────────────────────────────────────────────────────────
yellowstone-grpc-client = { git = "https://github.com/rpcpool/yellowstone-grpc", branch = "master" }
yellowstone-grpc-proto  = { git = "https://github.com/rpcpool/yellowstone-grpc", branch = "master" }
tonic = { version = "0.11", features = ["tls", "tls-roots"] }
prost = "0.12"

# ── jito (json-rpc over reqwest, no special sdk needed) ────────────────────────
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── serde ──────────────────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
bincode    = "1"
borsh      = "1"

# ── errors ─────────────────────────────────────────────────────────────────────
anyhow    = "1"
thiserror = "1"

# ── logging ────────────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── concurrency ────────────────────────────────────────────────────────────────
dashmap           = "5"
parking_lot       = "0.12"
crossbeam-channel = "0.5"

# ── math ───────────────────────────────────────────────────────────────────────
uint         = "0.9"
rust_decimal = { version = "1", features = ["maths"] }

# ── config ─────────────────────────────────────────────────────────────────────
dotenvy = "0.15"
clap    = { version = "4", features = ["derive", "env"] }

# ── misc ───────────────────────────────────────────────────────────────────────
base64   = "0.22"
bs58     = "0.5"
futures  = "0.3"
once_cell = "1"
rand     = "0.8"
ahash    = "0.8"

[profile.release]
opt-level     = 3
lto           = "fat"       # expensive at compile time, worth it
codegen-units = 1           # single CGU for max inlining across crates
panic         = "abort"     # no unwinding overhead
strip         = "symbols"   # smaller binary, harder to reverse

[profile.release.build-override]
opt-level = 3
